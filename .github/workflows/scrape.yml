name: Scrape latest carrier data

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      force_image_reprocess:
        description: "Bust the image cache and re-run OpenAI vision on every tracker image"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - id: scrape
        run: npm run scrape
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.5' }}
          FORCE_IMAGE_REPROCESS: ${{ inputs.force_image_reprocess && '1' || '' }}
      - name: Commit updated data
        env:
          CHANGED_HULLS: ${{ steps.scrape.outputs.changedHulls }}
        run: |
          if [ -z "$CHANGED_HULLS" ] && git diff --quiet scripts/map-image-cache.json; then
            echo "No meaningful changes; skipping commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/carriers.json scripts/map-image-cache.json
          if [ -n "$CHANGED_HULLS" ]; then
            hulls=$(echo "$CHANGED_HULLS" | sed 's/,/, /g')
            git commit -m "Update carrier data: $hulls"
          else
            git commit -m "Refresh image analysis cache"
          fi
          git push
